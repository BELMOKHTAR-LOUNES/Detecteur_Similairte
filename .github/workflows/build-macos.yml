name: Build macOS

# PyInstaller ne cross-compile pas : les executables macOS sont construits
# directement sur des runners macOS, pour Intel et Apple Silicon, puis
# fusionnes en binaires universels (x86_64 + arm64).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-15
            arch: apple-silicon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build GUI and CLI
        run: |
          python -m PyInstaller tools/detecteur_similarite.spec --noconfirm
          python -m PyInstaller tools/cli_similarite.spec --noconfirm

      - name: Add samples to dist folders
        run: |
          rm -rf "dist/CLI-Similarite/samples"
          cp -R samples "dist/CLI-Similarite/samples"

      - name: Package artifacts
        run: |
          mkdir -p dist/macos
          ditto -c -k --keepParent \
            dist/DetecteurDeSimilarite.app \
            "dist/macos/DetecteurDeSimilarite-${{ matrix.arch }}.app.zip"
          tar -czf "dist/macos/CLI-Similarite-${{ matrix.arch }}.tar.gz" \
            -C dist/CLI-Similarite .

      - name: Upload macOS executables
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/macos/*
          if-no-files-found: error

  universal:
    name: macOS universel
    needs: build
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download architecture-specific artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: artifacts

      - name: Extract builds
        run: |
          mkdir -p work/intel work/arm work/universal
          ditto -x -k artifacts/macos-intel/DetecteurDeSimilarite-intel.app.zip work/intel
          ditto -x -k artifacts/macos-apple-silicon/DetecteurDeSimilarite-apple-silicon.app.zip work/arm
          tar -xzf artifacts/macos-intel/CLI-Similarite-intel.tar.gz -C work/intel
          tar -xzf artifacts/macos-apple-silicon/CLI-Similarite-apple-silicon.tar.gz -C work/arm

      - name: Merge into universal binaries
        run: bash tools/merge_macos_universal.sh work/intel work/arm work/universal

      - name: Package universal artifacts
        run: |
          mkdir -p dist/macos
          ditto -c -k --keepParent \
            work/universal/DetecteurDeSimilarite.app \
            dist/macos/DetecteurDeSimilarite-universal.app.zip
          tar -czf dist/macos/CLI-Similarite-universal.tar.gz \
            -C work/universal/CLI-Similarite .

      - name: Upload universal executables
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/macos/*
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos/DetecteurDeSimilarite-universal.app.zip
            dist/macos/CLI-Similarite-universal.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
